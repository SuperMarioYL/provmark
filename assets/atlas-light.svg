<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="provmark architecture: agent log and git diff feed a correlator that writes a .provmark.json sidecar, read by blame, review and the pre-commit hook">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors (under the marching dashes) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="190" y1="120" x2="250" y2="168" marker-end="url(#ah-l)"/>
    <line x1="190" y1="240" x2="250" y2="182" marker-end="url(#ah-l)"/>
    <line x1="420" y1="175" x2="466" y2="175" marker-end="url(#ah-l)"/>
    <line x1="640" y1="175" x2="686" y2="175" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (infinite loop, linear, staggered negative begin) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="190" y1="120" x2="246" y2="167" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="190" y1="240" x2="246" y2="183" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="420" y1="175" x2="462" y2="175" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="175" x2="682" y2="175" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- packet dots along the spine (correlator -> sidecar -> views) -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M420,175 L462,175" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M640,175 L682,175" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: breathing on the spine (correlator / sidecar / views), inputs static -->
  <g>
    <rect x="40" y="92" width="150" height="56" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
    <text x="115" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#4B3FC4">Agent session log</text>

    <rect x="40" y="212" width="150" height="56" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="115" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#0A4F9E">git diff</text>

    <rect x="250" y="140" width="170" height="70" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="335" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Correlator</text>
    <text x="335" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">hunks × edit-events</text>

    <rect x="470" y="140" width="170" height="70" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="555" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">.provmark.json</text>
    <text x="555" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#6E6E73">committed sidecar</text>

    <rect x="690" y="140" width="150" height="70" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="765" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#4B3FC4">blame</text>
    <text x="765" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#4B3FC4">review</text>
    <text x="765" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#4B3FC4">hook</text>
  </g>
</svg>
