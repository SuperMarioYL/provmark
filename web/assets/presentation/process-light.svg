<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="e6568b-e77f6a-f6ace2-e11c2a894968" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">provmark process</title><desc id="process-light-desc">The agent-marked hunk changes from unreviewed to reviewed.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#bd4672"/><stop offset=".6" stop-color="#a75c4d"/><stop offset="1" stop-color="#8e6383"/></linearGradient><radialGradient id="halo"><stop stop-color="#bd4672" stop-opacity=".22"/><stop offset="1" stop-color="#fef9fb" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbdc" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#bd4672" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#fef9fb"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#725e75" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#271623" font-size="30" text-anchor="start" font-weight="400">provmark / example workflow</text><path d="M332.0 237H356.0" fill="none" stroke="#bd4672" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M332.0 237H356.0" class="flow" fill="none" stroke="#8e6383" stroke-width="2"/><rect x="44.0" y="176" width="288.0" height="122" rx="12" fill="#fef7f9" stroke="#f7cbdc"/><text x="62.0" y="207.0" fill="#271623" font-size="21" text-anchor="start" font-weight="400">01  Create mixed</text><text x="62.0" y="236.4" fill="#271623" font-size="21" text-anchor="start" font-weight="400">edits</text><text x="62.0" y="259.0" fill="#725e75" font-size="17" text-anchor="start" font-weight="400">Two separated hunks</text><path d="M644.0 237H668.0" fill="none" stroke="#bd4672" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M644.0 237H668.0" class="flow" fill="none" stroke="#8e6383" stroke-width="2"/><rect x="356.0" y="176" width="288.0" height="122" rx="12" fill="#fef7f9" stroke="#f7cbdc"/><text x="374.0" y="207.0" fill="#271623" font-size="21" text-anchor="start" font-weight="400">02  Correlate one</text><text x="374.0" y="236.4" fill="#271623" font-size="21" text-anchor="start" font-weight="400">event</text><text x="374.0" y="259.0" fill="#725e75" font-size="17" text-anchor="start" font-weight="400">One agent / one human hunk</text><rect x="668.0" y="176" width="288.0" height="122" rx="12" fill="#fef7f9" stroke="#f7cbdc"/><text x="686.0" y="207.0" fill="#271623" font-size="21" text-anchor="start" font-weight="400">03  Review the agent</text><text x="686.0" y="236.4" fill="#271623" font-size="21" text-anchor="start" font-weight="400">range</text><text x="686.0" y="259.0" fill="#725e75" font-size="17" text-anchor="start" font-weight="400">Persist reviewed state</text><text x="44" y="379.0" fill="#8e6383" font-size="20" text-anchor="start" font-weight="400">The agent-marked hunk changes from unreviewed to reviewed.</text></svg>
